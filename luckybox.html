<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔫 CS2 开箱模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:linear-gradient(180deg,#0a0a0f,#14141e);
  font-family:'Segoe UI','PingFang SC',system-ui,sans-serif;
  overflow-x:hidden;
  color:#e0e0e0;
}
/* ===== 顶栏 ===== */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 24px;
  background:rgba(0,0,0,0.6);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.topbar .logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.topbar .logo .cs{color:#f5a623}
.topbar .stats{display:flex;gap:24px;font-size:13px;color:rgba(255,255,255,0.5)}
.topbar .stats span{color:#f5a623;font-weight:700}

/* ===== 容器 ===== */
.container{
  max-width:840px;
  margin:0 auto;
  padding:32px 16px 60px;
  text-align:center;
}

h1{
  font-size:28px;
  font-weight:800;
  background:linear-gradient(135deg,#f5a623,#e8c44a);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:4px;
}
.sub{
  color:rgba(255,255,255,0.35);
  font-size:14px;
  margin-bottom:28px;
}

/* ===== 箱子选择 ===== */
.case-selector{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-bottom:28px;
  flex-wrap:wrap;
}
.case-btn{
  padding:10px 22px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.04);
  color:#aaa;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  font-family:inherit;
  display:flex;
  align-items:center;
  gap:8px;
}
.case-btn:hover{background:rgba(255,255,255,0.08);color:#eee}
.case-btn.active{
  border-color:#f5a623;
  background:rgba(245,166,35,0.12);
  color:#f5a623;
  box-shadow:0 0 24px rgba(245,166,35,0.1);
}

/* ===== 开箱区域 ===== */
.unbox-area{
  position:relative;
  background:rgba(0,0,0,0.4);
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.06);
  padding:0;
  overflow:hidden;
  margin-bottom:20px;
}
.unbox-area .track-wrap{
  position:relative;
  overflow:hidden;
  height:200px;
  background:linear-gradient(90deg,rgba(0,0,0,0.6),transparent 15%,transparent 85%,rgba(0,0,0,0.6));
}
.unbox-area .track-wrap::before,
.unbox-area .track-wrap::after{
  content:'';
  position:absolute;
  top:0;bottom:0;
  width:120px;
  z-index:2;
  pointer-events:none;
}
.unbox-area .track-wrap::before{
  left:0;
  background:linear-gradient(90deg,rgba(10,10,15,0.95),transparent);
}
.unbox-area .track-wrap::after{
  right:0;
  background:linear-gradient(270deg,rgba(10,10,15,0.95),transparent);
}
.track{
  display:flex;
  gap:8px;
  padding:20px 0;
  transition: none;
  will-change:transform;
}
.track.spinning{
  animation:none;
}
.track-item{
  flex-shrink:0;
  width:120px;
  height:160px;
  border-radius:10px;
  background:rgba(255,255,255,0.04);
  border:2px solid rgba(255,255,255,0.08);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px;
  transition:0.3s;
  position:relative;
  overflow:hidden;
}
.track-item .icon{font-size:40px;margin-bottom:6px;position:relative;display:flex;align-items:center;justify-content:center;flex:1;width:100%;min-height:60px}
.track-item .item-name{font-size:11px;font-weight:700;text-align:center;line-height:1.3;max-width:100%;word-break:break-all}
.track-item .item-quality{font-size:10px;margin-top:4px;opacity:0.6;text-transform:uppercase;letter-spacing:0.5px}

/* 稀有度颜色 */
.rarity-consumer{border-color:#b0b0b0;color:#b0b0b0}
.rarity-industrial{border-color:#5e98d9;color:#5e98d9}
.rarity-milspec{border-color:#4b69ff;color:#4b69ff}
.rarity-restricted{border-color:#8847ff;color:#8847ff}
.rarity-classified{border-color:#d32ce6;color:#d32ce6}
.rarity-covert{border-color:#eb4b4b;color:#eb4b4b}
.rarity-special{border-color:#ffd700;color:#ffd700;box-shadow:0 0 30px rgba(255,215,0,0.15);background:rgba(255,215,0,0.05)}

/* 选中指示器 */
.indicator{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:5;
  pointer-events:none;
}
.indicator-arrow{
  font-size:36px;
  color:#f5a623;
  filter:drop-shadow(0 0 12px rgba(245,166,35,0.6));
  animation:bounceArrow 1s ease-in-out infinite;
}
@keyframes bounceArrow{
  0%,100%{transform:translateY(-4px)}
  50%{transform:translateY(4px)}
}
.indicator-line{
  width:120px;
  height:2px;
  background:#f5a623;
  margin:0 auto;
  box-shadow:0 0 20px rgba(245,166,35,0.6);
}

/* ===== 结果弹窗 ===== */
.result-win{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(12px);
  justify-content:center;
  align-items:center;
  animation:fadeIn 0.3s;
}
.result-win.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result-card{
  background:linear-gradient(145deg,#1a1a2e,#16213e);
  border:2px solid rgba(255,215,0,0.3);
  border-radius:24px;
  padding:40px 48px;
  max-width:420px;
  width:90%;
  text-align:center;
  animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes popIn{
  from{transform:scale(0.6);opacity:0}
  to{transform:scale(1);opacity:1}
}
.result-card .r-icon{font-size:72px;margin-bottom:12px;display:flex;justify-content:center;align-items:center;min-height:80px}
.result-card .r-name{font-size:28px;font-weight:800;margin-bottom:4px}
.result-card .r-quality{font-size:14px;margin-bottom:16px;letter-spacing:1px;text-transform:uppercase}
.result-card .r-desc{color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:24px}
.result-card .r-stars{font-size:16px;letter-spacing:4px;margin-bottom:20px;color:#ffd700}
.result-card .btn-close{
  padding:12px 40px;
  border:none;
  border-radius:50px;
  background:linear-gradient(135deg,#f5a623,#e8c44a);
  color:#0a0a0f;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
  font-family:inherit;
}
.result-card .btn-close:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(245,166,35,0.3)}

/* ===== 操作按钮 ===== */
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn-open{
  padding:16px 52px;
  border:none;
  border-radius:50px;
  background:linear-gradient(135deg,#f5a623,#d4891a);
  color:#0a0a0f;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  transition:0.3s;
  font-family:inherit;
  box-shadow:0 8px 40px rgba(245,166,35,0.25);
  display:flex;
  align-items:center;
  gap:10px;
}
.btn-open:hover{transform:translateY(-3px);box-shadow:0 12px 50px rgba(245,166,35,0.35)}
.btn-open:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-open:active:not(:disabled){transform:translateY(0)}
.btn-skip{
  padding:14px 28px;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:50px;
  background:rgba(255,255,255,0.05);
  color:#888;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  font-family:inherit;
}
.btn-skip:hover{background:rgba(255,255,255,0.1);color:#eee}

/* ===== 掉落日志 ===== */
.log-section{
  margin-top:28px;
  text-align:left;
}
.log-section h3{
  font-size:14px;
  color:rgba(255,255,255,0.3);
  margin-bottom:12px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:uppercase;
}
.log{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.log-item{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 12px 4px 8px;
  border-radius:6px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
  font-size:12px;
  font-weight:600;
}
.log-item .li-icon{font-size:16px}

@media(max-width:600px){
  .track-item{width:90px;height:130px}
  .track-item .icon{font-size:30px}
  .track-item .item-name{font-size:10px}
  .result-card{padding:28px 24px}
  .result-card .r-icon{font-size:52px;min-height:60px}
  .result-card .r-name{font-size:22px}
}
</style>
</head>

let currentCase = 0;

let canSkip = false;

const rarities = ['Consumer', 'Industrial', 'Mil-Spec', 'Restricted', 'Classified', 'Covert', 'Special'];
const rarityMap = ['rarity-consumer','rarity-industrial','rarity-milspec','rarity-restricted','rarity-classified','rarity-covert','rarity-special'];

// ===== 初始化 =====
function initCases() {
  const sel = document.getElementById('caseSelector');
  CASES.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'case-btn' + (i === 0 ? ' active' : '');
    btn.innerHTML = `${c.emoji} ${c.name}`;
    btn.onclick = () => selectCase(i);
    sel.appendChild(btn);
  });
}
initCases();

function selectCase(i) {
  if (isOpening) return;
  currentCase = i;
  document.querySelectorAll('.case-btn').forEach((b, j) => b.classList.toggle('active', j === i));
}

function weightedRandom(caseIdx) {
  const c = CASES[caseIdx];
  const entries = Object.entries(c.weights);
  const total = entries.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [key, w] of entries) {
    r -= w;
    if (r <= 0) return key;
  }
  return 'Consumer';
}

function getSkin(rarity) {
  const pool = SKINS[rarity] || SKINS['Consumer'];
  const s = pool[Math.floor(Math.random() * pool.length)];
  return { name: s.n, emoji: s.e, img: s.i ? IMG + s.i : null };
}

function rarityIndex(rarity) {
  return rarities.indexOf(rarity);
}

// ===== 渲染轨道 =====
function renderTrack(items, highlightIdx = -1) {
  const track = document.getElementById('track');
  track.innerHTML = '';
  items.forEach((item, idx) => {
    const div = document.createElement('div');
    const ri = rarityIndex(item.rarity);
    div.className = `track-item ${rarityMap[ri] || 'rarity-consumer'}`;
    div.innerHTML = `
      <div class="icon">${item.img ? `<img src="${item.img}" alt="${item.name}" style="width:100%;height:100%;object-fit:contain;position:absolute;inset:0;padding:4px">` : item.emoji}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-quality">${WEAPONS[item.rarity]?.label || item.rarity}</div>
    `;
    track.appendChild(div);
  });
}

function generateSpinItems(winnerRarity) {
  const items = [];
  const count = 30 + Math.floor(Math.random() * 10);
  for (let i = 0; i < count; i++) {
    // 越靠近中间(目标位置)越容易出 winner
    const dist = Math.abs(i - 15);
    let rarity;
    if (dist === 0) {
      rarity = winnerRarity;
    } else {
      // 随机，但靠近目标的给更好品质
      const r = Math.random();
      const ri = rarityIndex(winnerRarity);
      const maxIdx = rarities.length - 1;
      const offset = Math.floor(Math.random() * 3) + Math.max(0, dist - 2);
      const idx = Math.max(0, Math.min(maxIdx, ri + (r < 0.3 ? -offset : r < 0.6 ? 0 : offset)));
      rarity = rarities[idx];
    }
    const skin = getSkin(rarity);
    items.push({ name: skin.name, emoji: skin.emoji, img: skin.img, rarity });
  }
  // 确保第15个是winner
  const winIdx = 15;
  const winSkin = getSkin(winnerRarity);
  items[winIdx] = { name: winSkin.name, emoji: winSkin.emoji, img: winSkin.img, rarity: winnerRarity };
  return items;
}

// ===== 开箱 =====
function openCase() {
  if (isOpening) return;
  isOpening = true;
  canSkip = false;
  document.getElementById('openBtn').disabled = true;
  document.getElementById('skipBtn').textContent = '⏳ 开箱中...';

  const winnerRarity = weightedRandom(currentCase);
  const items = generateSpinItems(winnerRarity);
  const track = document.getElementById('track');

  // 计算位置：目标在索引15，居中显示
  const itemWidth = 128;
  const trackRect = track.parentElement.getBoundingClientRect();
  const centerOffset = (trackRect.width / 2) - (itemWidth / 2) - 20;
  const targetOffset = -(15 * itemWidth) + centerOffset;

  // 先快速填充
  renderTrack(items);
  track.style.transition = 'none';
  track.style.transform = `translateX(${targetOffset + 800}px)`;
  track.offsetHeight; // force reflow

  // 动画
  const duration = 2500 + Math.random() * 1000;
  track.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0.8, 0.2, 1)`;
  track.style.transform = `translateX(${targetOffset}px)`;

  canSkip = true;
  document.getElementById('skipBtn').textContent = '⏩ 跳过';

  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    canSkip = false;
    isOpening = false;
    document.getElementById('openBtn').disabled = false;
    document.getElementById('skipBtn').textContent = '跳过 →';

    // 显示结果
    const winItem = items[15];
    showResult(winItem);
    totalOpened++;
    document.getElementById('totalOpened').textContent = totalOpened;

    addLog(winItem);
  };

  const timer = setTimeout(finish, duration + 200);

  document.getElementById('skipBtn').onclick = () => {
    if (!canSkip) return;
    clearTimeout(timer);
    track.style.transition = `transform 300ms cubic-bezier(0.2, 0.8, 0.3, 1)`;
    track.style.transform = `translateX(${targetOffset}px)`;
    setTimeout(finish, 400);
  };
}

// ===== 显示结果 =====
function showResult(item) {
  const win = document.getElementById('resultWin');
  const ri = rarityIndex(item.rarity);
  const rarityInfo = WEAPONS[item.rarity] || { label: item.rarity, color: '#fff', stars: '★' };

  const rIcon = document.getElementById('rIcon');
  if (item.img) {
    rIcon.innerHTML = `<img src="${item.img}" alt="${item.name}" style="width:100%;max-height:180px;object-fit:contain">`;
  } else {
    rIcon.textContent = item.emoji;
  }
  document.getElementById('rName').textContent = item.name;
  document.getElementById('rName').style.color = rarityInfo.color;
  document.getElementById('rQuality').textContent = rarityInfo.label;
  document.getElementById('rQuality').style.color = rarityInfo.color;
  document.getElementById('rDesc').textContent = `品质：${item.rarity}`;
  document.getElementById('rStars').textContent = rarityInfo.stars;
  win.classList.add('show');

  // 特殊音效感觉 - 页面闪烁
  if (ri >= 4) {
    const flashColor = ri === 6 ? '#1a1a00' : '#1a0a0a';
    const glowColor = ri === 6 ? 'rgba(255,215,0,0.3)' : 'rgba(255,71,87,0.3)';
    document.body.style.transition = '0.05s';
    document.body.style.background = flashColor;
    document.body.style.boxShadow = `inset 0 0 200px ${glowColor}`;
    setTimeout(() => { document.body.style.background = ''; document.body.style.boxShadow = ''; }, 200);
  }
}

document.getElementById('closeResult').onclick = () => {
  document.getElementById('resultWin').classList.remove('show');
};

// ===== 日志 =====
function addLog(item) {
  openHistory.unshift(item);
  if (openHistory.length > 50) openHistory.pop();
  const log = document.getElementById('log');
  log.innerHTML = openHistory.map(it => {
    const ri = rarityIndex(it.rarity);
    return `<span class="log-item" style="border-color:${WEAPONS[it.rarity]?.color || '#888'}">
      <span class="li-icon">${it.img ? `<img src="${it.img}" alt="" style="width:20px;height:20px;object-fit:contain;vertical-align:middle">` : it.emoji}</span> ${it.name}
    </span>`;
  }).join('');
}

// ===== 绑定事件 =====
document.getElementById('openBtn').addEventListener('click', openCase);

// 键盘回车
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    const win = document.getElementById('resultWin');
    if (win.classList.contains('show')) {
      win.classList.remove('show');
    } else {
      openCase();
    }
  }
});
