function canUseAs(card,as,p) {
  if (card.type===as) return true;
  if (as==='sha' && (card.type==='leisha'||card.type==='huosha')) return true;
  if (card.sub===as) return true;
  if (card.cat==='basic') {
    if (as==='sha'&&p.hero.id==='guanyu'&&SCOL[card.suit]==='red') return true;
    if (p.hero.id==='zhaoyun') {
      if(card.type==='sha'&&as==='shan') return true;
      if(card.type==='shan'&&as==='sha') return true;
    }
  }
  return false;
}
async function checkWuxie(user, card) {
  const target = G.players.find(x => x !== user && x.alive);
  if (!target) return false;
  const idx = target.hand.findIndex(c => c.sub === 'counter');
  if (idx === -1) return false;
  if (target.isAI) {
    const harmful = ['disarm','snatch','duel','aoe'];
    if (!harmful.includes(card.sub)) return false;
    const c = target.hand.splice(idx, 1)[0]; G.discard.push(c);
    addLog(target.name+'使用【无懈可击】抵消'+card.name);
    G.cardFrom=1; showCard(c); rAll(); await sleep(500); showCard(null); return true;
  }
  const want = await new Promise(resolve => {
    const area = $('responseArea'), prompt = $('respP'), hand = $('respHand'), cancel = $('respCancel');
    prompt.textContent = '对方使用【'+card.name+'】，是否用无懈可击？';
    hand.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'card card-back';
    el.innerHTML = '<div class="inner">无懈可击</div>';
    el.onclick = () => {
      area.classList.remove('show');
      const c = target.hand.splice(idx, 1)[0]; G.discard.push(c);
      addLog(target.name+'使用【无懈可击】抵消'+card.name);
      G.cardFrom=0; showCard(c); rAll();
      resolve(true);
    };
    hand.appendChild(el);
    cancel.onclick = () => { area.classList.remove('show'); resolve(false); };
    area.classList.add('show');
  });
  if (want) { await sleep(600); showCard(null); return true; }
  return false;
}
function pickCard(owner, title) {
  return new Promise(resolve => {
    const area = $('responseArea'), prompt = $('respP'), hand = $('respHand'), cancel = $('respCancel');
    prompt.textContent = title;
    hand.innerHTML = '';
    EQUIP_SLOTS.forEach(s=>{
      if(owner.equip[s]){
        const eqDiv = document.createElement('div');
        eqDiv.className = 'card card-back';
        eqDiv.innerHTML = '<div class="inner">'+EQUIP_LABEL[s]+'</div>';
        eqDiv.onclick = () => { area.classList.remove('show'); resolve({ type: 'equip', equipSlot: s }); };
        hand.appendChild(eqDiv);
      }
    });
    owner.hand.forEach((c, i) => {
      const el = document.createElement('div');
      el.className = 'card card-back';
      el.innerHTML = '<div class="inner">手牌'+(i+1)+'</div>';
      el.onclick = () => { area.classList.remove('show'); resolve({ type: 'hand', idx: i }); };
      hand.appendChild(el);
    });
    cancel.onclick = () => { area.classList.remove('show'); resolve(null); };
    area.classList.add('show');
  });
}
function waitResp(player,type,count) {
  return new Promise(resolve=>{
    if (player.isAI) { resolve(false); return; }
    const usable=player.hand.map((c,i)=>({c,i})).filter(({c})=>canUseAs(c,type,player));
    const prompt=document.getElementById('respPrompt')||(()=>{
      const el=document.createElement('div'); el.id='respPrompt';
      el.style.cssText='position:fixed;bottom:190px;left:50%;transform:translateX(-50%);z-index:100;color:#ffdd88;font-size:16px;background:rgba(0,0,0,.8);padding:6px 20px;border-radius:6px;border:1px solid #886644;pointer-events:none;text-align:center;white-space:nowrap;';
      document.body.appendChild(el);
      const cancel=document.createElement('button');
      cancel.id='respCancelBtn';
      cancel.className='btn btn-danger btn-sm';
      cancel.textContent='不出';
      cancel.style.cssText='position:fixed;bottom:155px;left:50%;transform:translateX(-50%);z-index:101;';
      cancel.onclick=()=>{
        const r=window._waitResp; window._waitResp=null;
        document.getElementById('respPrompt')?.remove();
        document.getElementById('respCancelBtn')?.remove();
        r?.resolve(false);
      };
      document.body.appendChild(cancel);
      return el;
    })();
    prompt.textContent='请出【'+(type==='sha'?'杀':type==='shan'?'闪':type==='tao'?'桃':'')+'】 ('+(count>1?'需'+count+'张':'点击手牌')+')';
    window._waitResp={resolve,type,count,usableIdx:new Set(usable.map(u=>u.i))};
    rHand();
    if (!usable.length) setTimeout(()=>{ cancel.click(); },300);
  });
}
function onCardClick(idx) {
  const p=G.players[0];
  if (!p||!p.alive) return;
  if (window._waitResp) {
    const card=p.hand[idx];
    if (!card) return;
    const wr=window._waitResp;
    if (wr.usableIdx.has(idx) && canUseAs(card, wr.type, p)) {
      const used=p.hand.splice(idx,1)[0];
      G.discard.push(used);
      G.cardFrom=0; showCard(used); rAll();
      window._waitResp=null;
      document.getElementById('respPrompt')?.remove();
      document.getElementById('respCancelBtn')?.remove();
      wr.resolve(true);
    } else {
      msg('不能出这张牌',600);
    }
    return;
  }
  if (G.phase==='discard'&&window._discard) {
    const pos=G.selCards.indexOf(idx);
    if (pos===-1) { if(G.selCards.length<p.hand.length-p.hp) G.selCards.push(idx); }
    else G.selCards.splice(pos,1);
    const btn=$('db');
    if(btn) btn.textContent='弃'+(p.hand.length-p.hp)+'张(选'+G.selCards.length+')';
    rHand(); return;
  }
  if (window._zhihengMode) {
    const pos=G.selCards.indexOf(idx);
    if (pos===-1) G.selCards.push(idx);
    else G.selCards.splice(pos,1);
    const btn=$('zhBtn');
    if(btn) btn.textContent='确认制衡 (选'+G.selCards.length+'张)';
    rHand(); return;
  }
  if (G.phase==='play') {
    if (G.busy) return;
    const card = p.hand[idx];
    if (!card) return;
    // 桃：受伤时点击直接吃
    if (card.type === 'tao' && p.hp < p.hpMax) { useTao(p); return; }
    // 酒：点击直接使用
    if (card.type === 'jiu') { useJiu(p); return; }
    // 装备：点击直接装备
    if (card.cat === 'equip') { useEquip(p, idx); return; }
    // 锦囊（非无懈）：点击直接使用
    if (card.cat === 'strategy' && card.sub !== 'counter') { useStrategy(p, idx); return; }
    if (card.sub === 'counter') { msg('无懈可击仅能在对方使用锦囊时响应', 1200); return; }
    // 杀：可出杀时点击直接出
    if (G.canSha && canUseAs(card, 'sha', p)) { useSha(p, idx); return; }
    // 不能直接用的牌，显示信息
    msg(card.name+' '+SSYM[card.suit]+card.num, 800);
  }
}

// ====== AI ======
async function aiPlay(p) {
  G.phase='play'; rPhase('play',G.turn); msg('AI思考...',800); await sleep(1200);
  G.cardFrom=1;
  let acted=true, safety=0;
  while(acted&&safety<30) {
    safety++; acted=false;
    const wi=p.hand.findIndex(c=>c.cat==='equip');
    if(wi!==-1){await useEquip(p,wi);acted=true;await sleep(700);continue;}
    if(p.hp<p.hpMax){const ti=p.hand.findIndex(c=>canUseAs(c,'tao',p));if(ti!==-1){await useTao(p);acted=true;await sleep(700);continue;}}
    const wi2=p.hand.findIndex(c=>c.sub==='draw');
    if(wi2!==-1){const c=p.hand.splice(wi2,1)[0];G.discard.push(c);addLog(p.name+'使用无中生有');showCard(c);await rw(900);if(await checkWuxie(p,c)){showCard(null);acted=true;await sleep(700);continue;}await drawCards(p,2);showCard(null);acted=true;await sleep(700);continue;}
    const wi3=p.hand.findIndex(c=>c.sub==='disarm');
    if(wi3!==-1){const t=G.players.find(x=>x!==p&&x.alive);if(t&&(t.hand.length||hasEquip(t))){const c=p.hand.splice(wi3,1)[0];G.discard.push(c);addLog(p.name+'使用过河拆桥');showCard(c);await rw(900);if(await checkWuxie(p,c)){showCard(null);acted=true;await sleep(700);continue;}if(t.hand.length){const rc=t.hand.splice(Math.floor(Math.random()*t.hand.length),1)[0];G.discard.push(rc);G.cardFrom=0;showCard(rc);rAll();await sleep(600);showCard(null);}else if(hasEquip(t)){const slots=getEquipSlots(t);const s=slots[Math.floor(Math.random()*slots.length)];G.discard.push(t.equip[s]);t.equip[s]=null;showCard(null);}animCount(t,-1);rAll();acted=true;await sleep(700);continue;}}
    const wi4=p.hand.findIndex(c=>c.sub==='snatch');
    if(wi4!==-1){const t=G.players.find(x=>x!==p&&x.alive);if(t&&(t.hand.length||hasEquip(t))&&dist(p,t)<=1){const c=p.hand.splice(wi4,1)[0];G.discard.push(c);addLog(p.name+'使用顺手牵羊');showCard(c);await rw(900);if(await checkWuxie(p,c)){showCard(null);acted=true;await sleep(700);continue;}let stolen2=t.hand.length>0?t.hand.splice(Math.floor(Math.random()*t.hand.length),1)[0]:null;if(!stolen2&&hasEquip(t)){const slots=getEquipSlots(t);const s=slots[Math.floor(Math.random()*slots.length)];stolen2=t.equip[s];t.equip[s]=null;}if(stolen2){animSteal(t,p,stolen2);if(stolen2.cat==='equip'){const slot=equipSlot(stolen2);if(p.equip[slot])G.discard.push(p.equip[slot]);p.equip[slot]=stolen2;}else p.hand.push(stolen2);await sleep(700);}animCount(t,-1);rAll();acted=true;await sleep(700);continue;}}
    const wi5=p.hand.findIndex(c=>c.sub==='duel');
    if(wi5!==-1){const t=G.players.find(x=>x!==p&&x.alive);if(t){const c=p.hand.splice(wi5,1)[0];G.discard.push(c);addLog(p.name+'使用决斗');showCard(c);await rw(900);if(await checkWuxie(p,c)){showCard(null);acted=true;await sleep(700);continue;}let cur=t,atk=p,done=false;while(!done){if(cur.isAI){const si=cur.hand.findIndex(c=>canUseAs(c,'sha',cur));if(si!==-1){const sc=cur.hand.splice(si,1)[0];G.discard.push(sc);addLog(cur.name+'打出【杀】');G.cardFrom=cur.isAI?1:0;showCard(sc);rAll();await sleep(700);showCard(null);[cur,atk]=[atk,cur];}else{await dealDamage(atk,cur,1,c);done=true;}}else{if(!await waitResp(cur,'sha',1)){await dealDamage(atk,cur,1,c);done=true;}else{[cur,atk]=[atk,cur];}}rAll();await sleep(350);if(!cur.alive){done=true;checkOver();}}showCard(null);if(G.phase==='gameOver')return;acted=true;await sleep(700);continue;}}
    const wi6=p.hand.findIndex(c=>c.sub==='aoe');
    if(wi6!==-1){const t=G.players.find(x=>x!==p&&x.alive);if(t){const c=p.hand.splice(wi6,1)[0];G.discard.push(c);const need=c.name==='南蛮入侵'?'sha':'shan';addLog(p.name+'使用【'+c.name+'】');showCard(c);await rw(900);if(await checkWuxie(p,c)){showCard(null);acted=true;await sleep(700);continue;}if(t.isAI){const ri=t.hand.findIndex(c=>canUseAs(c,need,t));if(ri!==-1){const rc=t.hand.splice(ri,1)[0];G.discard.push(rc);addLog(t.name+'打出【'+(need==='sha'?'杀':'闪')+'】');G.cardFrom=1;showCard(rc);rAll();await sleep(600);showCard(null);}else await dealDamage(p,t,1,c);}else{if(!await waitResp(t,need,1))await dealDamage(p,t,1,c);}showCard(null);rAll();await sleep(350);checkOver();if(G.phase==='gameOver')return;acted=true;continue;}}
    const wi7=p.hand.findIndex(c=>c.sub==='healAll');
    if(wi7!==-1&&G.players.some(pl=>pl.alive&&pl.hp<pl.hpMax)){const c=p.hand.splice(wi7,1)[0];G.discard.push(c);addLog(p.name+'使用桃园结义');showCard(c);await rw(900);if(await checkWuxie(p,c)){showCard(null);acted=true;await sleep(700);continue;}G.players.forEach(pl=>{if(pl.alive&&pl.hp<pl.hpMax)pl.hp++;});showCard(null);rAll();acted=true;await sleep(700);continue;}
    const wi8=p.hand.findIndex(c=>c.sub==='drawShow');
    if(wi8!==-1){const c=p.hand.splice(wi8,1)[0];G.discard.push(c);addLog(p.name+'使用五谷丰登');showCard(c);await rw(900);if(await checkWuxie(p,c)){showCard(null);acted=true;await sleep(700);continue;}
      const alive=G.players.filter(pl=>pl.alive); const revealed=[];
      for(let i=0;i<alive.length;i++){if(!G.deck.length){if(!G.discard.length)break;G.deck=shuffle(G.discard);G.discard=[];addLog('洗牌');}revealed.push(G.deck.pop());}
      const order=[...alive].sort((a,b)=>a===p?-1:b===p?1:0);
      for(const pl of order){if(!revealed.length)break;
        if(pl.isAI){const picked=revealed.splice(Math.floor(Math.random()*revealed.length),1)[0];pl.hand.push(picked);animCount(pl,1);addLog(pl.name+'获得【'+picked.name+'】');}
        else{await new Promise(resolve=>{
          const area=document.createElement('div'); area.id='wuguArea';
          area.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;display:flex;gap:8px;padding:14px;background:rgba(0,0,0,.7);border-radius:8px;border:1px solid #886644;';
          const label=document.createElement('div'); label.textContent='选择一张牌';
          label.style.cssText='position:absolute;top:-26px;left:0;right:0;text-align:center;color:#ffdd88;font-size:14px;'; area.appendChild(label);
          revealed.forEach((rc,i)=>{const el=document.createElement('div');const ct=rc.type==='sha'||rc.type==='shan'||rc.type==='tao'?rc.type:rc.cat;
            el.className='card suit-'+SCOL[rc.suit]+' card-'+ct;el.style.cursor='pointer';el.style.transition='transform .2s';
            el.innerHTML='<div class="inner"><div class="suit">'+SSYM[rc.suit]+rc.num+'</div><div>'+rc.name+'</div></div>';
            el.onmouseenter=()=>el.style.transform='translateY(-12px)';el.onmouseleave=()=>el.style.transform='';
            el.onclick=()=>{const picked=revealed.splice(i,1)[0];pl.hand.push(picked);animCount(pl,1);addLog(pl.name+'获得【'+picked.name+'】');area.remove();showCard(picked);setTimeout(()=>{showCard(null);},200);rAll();resolve();};
            area.appendChild(el);});
          document.body.appendChild(area);});}
        rAll();
      }
      revealed.forEach(c=>G.discard.push(c));
      showCard(null);rAll();acted=true;await sleep(700);continue;}
    // 酒：先喝酒再杀
    const jiuIdx=p.hand.findIndex(c=>c.type==='jiu');
    if(jiuIdx!==-1&&p.hp>0&&!G.jiuDrunk){const shaIdx=p.hand.findIndex(c=>canUseAs(c,'sha',p));if(shaIdx!==-1){await useJiu(p);acted=true;await sleep(400);continue;}}
    // 火攻
    const hgIdx=p.hand.findIndex(c=>c.sub==='fireAttack');
    if(hgIdx!==-1){const t=G.players.find(x=>x!==p&&x.alive);if(t&&t.hand.length){const c=p.hand.splice(hgIdx,1)[0];G.discard.push(c);addLog(p.name+'使用火攻');showCard(c);await rw(900);if(await checkWuxie(p,c)){showCard(null);acted=true;await sleep(700);continue;}const rc=t.hand[Math.floor(Math.random()*t.hand.length)];const match=p.hand.find(x=>x.suit===rc.suit);if(match){const mi=p.hand.indexOf(match);p.hand.splice(mi,1);G.discard.push(match);G.cardFrom=0;showCard(match);rAll();await sleep(400);await dealDamage(p,t,1,c);}showCard(null);rAll();acted=true;await sleep(700);continue;}}
    // 借刀杀人
    const jdIdx=p.hand.findIndex(c=>c.sub==='stealWeapon');
    if(jdIdx!==-1){const t=G.players.find(x=>x!==p&&x.alive);if(t&&t.equip.weapon&&dist(p,t)<=1){const c=p.hand.splice(jdIdx,1)[0];G.discard.push(c);addLog(p.name+'使用借刀杀人');showCard(c);await rw(900);if(await checkWuxie(p,c)){showCard(null);acted=true;await sleep(700);continue;}animSteal(t,p,t.equip.weapon);rAll();if(p.equip.weapon)G.discard.push(p.equip.weapon);p.equip.weapon=t.equip.weapon;t.equip.weapon=null;await sleep(700);rAll();acted=true;await sleep(700);continue;}}
    // 铁索连环
    const chainIdx=p.hand.findIndex(c=>c.sub==='chain');
    if(chainIdx!==-1){const alive=G.players.filter(x=>x.alive);if(alive.length>=2){const c=p.hand.splice(chainIdx,1)[0];addLog(p.name+'使用【铁索连环】');showCard(c);await rw(900);if(await checkWuxie(p,c)){G.discard.push(c);showCard(null);acted=true;await sleep(700);continue;}G.discard.push(c);const targets=[];const pool=[...alive];const t1=pool.splice(Math.floor(Math.random()*pool.length),1)[0];targets.push(t1);const t2=pool.splice(Math.floor(Math.random()*pool.length),1)[0];targets.push(t2);targets.forEach(t=>{t.chained=!t.chained;addLog(t.name+(t.chained?'被横置':'被重置'));});showCard(null);rAll();acted=true;await sleep(700);continue;}else{p.hand.splice(chainIdx,1);G.discard.push(c);addLog(p.name+'重铸铁索连环');await drawCards(p,1);acted=true;await sleep(700);continue;}}
    // 延时锦囊
    const delaySubs={skipPlay:'lebu',thunder:'shandian',skipDraw:'bingliang'};
    for(const[ds,dn] of Object.entries(delaySubs)){const di=p.hand.findIndex(c=>c.sub===ds);if(di!==-1){const t=G.players.find(x=>x!==p&&x.alive);if(t){if(ds==='skipDraw'&&dist(p,t)>1)continue;const c=p.hand.splice(di,1)[0];addLog(p.name+'使用【'+c.name+'】');showCard(c);await rw(900);if(await checkWuxie(p,c)){G.discard.push(c);showCard(null);acted=true;await sleep(700);break;}t.delayed.push(c);addLog(c.name+'已置于'+t.name+'判定区');showCard(null);rAll();acted=true;await sleep(700);break;}}}
    if(acted)continue;
    if(G.canSha||G.zhangfei){const si=p.hand.findIndex(c=>canUseAs(c,'sha',p));if(si!==-1&&G.players.find(x=>x!==p&&x.alive)){await useSha(p);acted=true;await sleep(700);continue;}}
    if(p.hero.id==='sunquan'&&!p.zhiheng&&p.hand.length>0){const hasGood=p.hand.some(c=>canUseAs(c,'sha',p)||canUseAs(c,'shan',p)||c.cat==='equip');if(!hasGood||p.hand.length<=1){await useZhiheng(p);acted=true;await sleep(700);continue;}}
  }
  G.phase='play'; rActs(null);
}

// ====== 获取牌菜单 ======
const CM_CATS = {basic:[],strategy:[],equip:[]};
for (const [k,v] of Object.entries(CARD_DEF)) {
  if (CM_CATS[v.cat]) CM_CATS[v.cat].push({key:k, ...v});
}
let _cmTab='basic';
function showCardMenu() {
  _cmTab='basic';
  document.querySelectorAll('#cmTabs button').forEach((b,i)=>b.classList.toggle('active',i===0));
  renderCMGrid('basic');
  $('cardMenuOverlay').classList.add('show');
}
function closeCardMenu() { $('cardMenuOverlay').classList.remove('show'); }
function switchCMTab(cat) {
  _cmTab=cat;
  document.querySelectorAll('#cmTabs button').forEach((b,i)=>b.classList.toggle('active',['basic','strategy','equip'][i]===cat));
  renderCMGrid(cat);
}
function renderCMGrid(cat) {
  const grid=$('cmGrid'); grid.innerHTML='';
  CM_CATS[cat].forEach(cd=>{
    const el=document.createElement('div'); el.className='cm-card';
    const first=G.deck.length?G.deck.find(c=>c.type===cd.key):null;
    const suit=first?first.suit:'spade'; const num=first?first.num:1;
    el.style.borderColor=cd.cat==='equip'?'#cc8844':cd.cat==='strategy'?'#aa66cc':'#cc4444';
    el.innerHTML='<div class="cm-name">'+cd.name+'</div><div class="cm-suit">'+ssym[suit]+num+'</div>';
    el.onclick=()=>{
      const p=G.players[0]; if(!p||!p.alive)return;
      const card={id:G.deck.length+G.discard.length+Math.random(),type:cd.key,suit:Math.random()>.5?'spade':'heart',num:Math.ceil(Math.random()*13),cat:cd.cat,sub:cd.sub,name:cd.name};
      p.hand.push(card); rAll(); animCount(p,1);
      addLog('获得【'+cd.name+'】');
      showCard(card); setTimeout(()=>showCard(null),300);
    };
    grid.appendChild(el);
  });
}
